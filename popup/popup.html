<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 420px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
    }
    .status {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status.error {
      background: #fee;
      color: #c33;
      border: 1px solid #fcc;
    }
    .status.loading {
      background: #eef;
      color: #33c;
      border: 1px solid #ccf;
    }
    .status.success {
      background: #efe;
      color: #3c3;
      border: 1px solid #cfc;
    }
    .field-group {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 4px;
    }
    input, textarea {
      font-size: 13px;
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
    }
    input:disabled, textarea:disabled {
      background: #f0f0f0;
      color: #999;
    }
    textarea {
      min-height: 60px;
      resize: vertical;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
    }
    .buttons {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 10px 12px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:active {
      opacity: 0.8;
    }
    .btn-primary {
      background: #007bff;
      color: white;
    }
    .btn-secondary {
      background: #ddd;
      color: #333;
    }
    .btn-primary:disabled, .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .config-link {
      font-size: 12px;
      text-align: center;
      margin-top: 12px;
    }
    .config-link a {
      color: #007bff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Save Creator Profile</h1>
    <div id="status"></div>
    <div id="form"></div>
    <div class="buttons">
      <button class="btn-secondary" id="cancelBtn">Cancel</button>
      <button class="btn-primary" id="saveBtn">Save</button>
    </div>
    <div class="config-link">
      <a href="#" id="optionsLink">Configure extension</a>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
